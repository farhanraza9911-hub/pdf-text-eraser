<title>Scan Document – PDF Text Eraser &amp; Editor</title>
<meta name="theme-color" content="#EEF1F5">
<meta name="robots" content="noindex">

<style>
:root{--bg:#EEF1F5;--surface:#F8FAFC;--text:#2A2F38;--muted:#6B7380;--primary:#D32F2F;
  --shadow:8px 8px 18px rgba(138,152,174,.45),-8px -8px 18px rgba(255,255,255,.9);
  --neu:5px 5px 10px rgba(138,152,174,.45),-5px -5px 10px rgba(255,255,255,.95);
  --neu-in:inset 3px 3px 6px rgba(138,152,174,.45),inset -3px -3px 6px rgba(255,255,255,.95)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#22252A;--surface:#282C32;--text:#E8EBF0;--muted:#A0A7B2;--primary:#FF8A80;
  --shadow:6px 6px 14px rgba(0,0,0,.45),-6px -6px 14px rgba(255,255,255,.04);
  --neu:4px 4px 9px rgba(0,0,0,.5),-4px -4px 9px rgba(255,255,255,.05);
  --neu-in:inset 3px 3px 6px rgba(0,0,0,.5),inset -3px -3px 6px rgba(255,255,255,.05)}}
:root[data-theme="dark"]{--bg:#22252A;--surface:#282C32;--text:#E8EBF0;--muted:#A0A7B2;--primary:#FF8A80;
  --shadow:6px 6px 14px rgba(0,0,0,.45),-6px -6px 14px rgba(255,255,255,.04);
  --neu:4px 4px 9px rgba(0,0,0,.5),-4px -4px 9px rgba(255,255,255,.05);
  --neu-in:inset 3px 3px 6px rgba(0,0,0,.5),inset -3px -3px 6px rgba(255,255,255,.05)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(420px,100%);background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:28px 24px;text-align:center}
.logo{width:76px;height:76px;border-radius:20px;box-shadow:var(--neu)}
h1{font-size:21px;margin:14px 0 4px}
p{margin:0 0 16px;color:var(--muted)}
input{width:100%;font:inherit;font-size:17px;letter-spacing:.06em;text-align:center;color:var(--text);background:var(--bg);border:0;border-radius:14px;padding:14px;box-shadow:var(--neu-in);outline:none}
input:focus{box-shadow:var(--neu-in),0 0 0 2px var(--primary)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin-top:14px;border:0;border-radius:16px;background:var(--surface);box-shadow:var(--neu);font:inherit;font-weight:700;color:var(--primary);cursor:pointer;text-decoration:none}
.btn:active{box-shadow:var(--neu-in)}
.btn:disabled{opacity:.6}
.btn.play{color:var(--text);font-weight:600}
.btn.play svg{width:22px;height:22px}
.row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;color:var(--muted);font-size:13px}
.err{min-height:20px;margin-top:10px;color:var(--primary);font-size:14px;font-weight:600}
.or{display:flex;align-items:center;gap:10px;margin:22px 0 4px;color:var(--muted);font-size:13px}
.or:before,.or:after{content:"";flex:1;height:1px;background:rgba(138,152,174,.35)}
footer{margin-top:18px;font-size:12px;color:var(--muted)}
footer a{color:var(--muted)}
</style>
</head>

  <h1>PDF Text Eraser &amp; Editor</h1>

    <button class="btn" id="go" type="submit">Unlock</button>
    <div class="err" id="err" role="alert"></div>
  </form>

  const KEY = 'pdfeditor-unlock';

  const toB64 = (u) => btoa(String.fromCharCode(...u));

  // lock.json holds the page key, wrapped with the site password (the admin can change it).
  let L = null;
  async function lock() {
    if (L) return L;

    if (!r.ok) throw new Error('lock');
